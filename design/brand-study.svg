<text x="1336" y="107" text-anchor="end" font-size="16" fill="#bdbdbd">NINE.AI / FARBSYSTEM / 05.09.2026</text>
<text x="64" y="246" font-size="55" font-weight="900">DIE FIGMA-SPRACHE BLEIBT.</text>
<text x="64" y="310" font-size="55" font-weight="900" fill="#1389ff">BLAU WIRD DIE MARKE.</text>
<text x="64" y="354" font-size="20" fill="#bdbdbd">Dunkle Bühne. Kräftige Typografie. Klare Flächen. Das originale Logo-Blau führt.</text>
<rect x="64" y="402" width="410" height="294" rx="24" fill="#1b1b1b"/>
<text x="92" y="445" font-size="15" fill="#bdbdbd">AKTION / DUNKLES LOGO-BLAU</text>
<text x="92" y="495" font-size="29" font-weight="700">Digitale Produkte bauen.</text>
<text x="92" y="534" font-size="18" fill="#bdbdbd">Klarer Einstieg, lesbare Beschriftung.</text>
<rect x="92" y="576" width="195" height="56" rx="8" fill="#0a4fd8"/>
<text x="189" y="611" text-anchor="middle" font-size="17" font-weight="700">Projekt starten</text>
<text x="92" y="669" font-size="15" fill="#bdbdbd">Weiß auf #0A4FD8 · 6,72:1</text>
<rect x="494" y="402" width="410" height="294" rx="24" fill="#1389ff"/>
<circle cx="558" cy="466" r="32" fill="#151515"/>
<text x="558" y="475" text-anchor="middle" font-size="28">↗</text>
<text x="526" y="553" font-size="31" fill="#151515" font-weight="700">Eine starke Fläche.</text>
<text x="526" y="592" font-size="18" fill="#151515">Das helle Blau übernimmt die Rolle</text>
<text x="526" y="619" font-size="18" fill="#151515">der Highlight-Karte aus Figma.</text>
<text x="526" y="669" font-size="15" fill="#151515">#151515 auf #1389FF · 5,26:1</text>
<rect x="924" y="402" width="412" height="294" rx="24" fill="#1b1b1b"/>
<text x="952" y="445" font-size="15" fill="#bdbdbd">EINE KONSISTENTE FARBWELT</text>
<rect x="952" y="479" width="130" height="34" rx="17" fill="#60a5fa"/>
<text x="1017" y="502" text-anchor="middle" font-size="15" fill="#151515" font-weight="700">Konsistent.</text>
<text x="952" y="562" font-size="25" font-weight="700">Blau bleibt die Farbe.</text>
<text x="952" y="606" font-size="18" fill="#bdbdbd">Logo-Blau, dunkle Neutraltöne, Weiß.</text>
<text x="952" y="634" font-size="18" fill="#bdbdbd">Eine klare Hierarchie in jeder Szene.</text>
<text x="952" y="669" font-size="15" fill="#bdbdbd">Keine gelben Flächen oder Zusatzakzente.</text>
